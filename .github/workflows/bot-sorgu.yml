name: Telegram Sorgu Botu

# AYRI workflow. `gunluk-rapor.yml` rapor uretir ve Telegram'a YAZAR;
# bu workflow yalnizca gelen soruyu OKUYUP cevaplar. Ikisini birlestirmek,
# sorgu botunun her kosusunda rapor hattini da calistirmak demekti.
#
# SALT OKUNUR: hicbir komut islem acmaz, portfoy dosyasi degistirmez.
# Repoya yazilan tek sey `simulasyon/bot_offset.txt` - son islenen
# Telegram update_id. Degismediyse commit ATILMAZ.
#
# TETIKLEME: asil yol WEBHOOK. Telegram mesaji Cloudflare Worker'a duser,
# Worker `repository_dispatch` atar, bu workflow ~40 saniyede cevap verir.
# Bkz. altyapi/telegram-webhook/ - kurulum ve Worker kodu orada.
#
# DAKIKA BUTCESI (private repo, GitHub Free = 2000 dk/ay, kosu basina
# YUKARI YUVARLANIR):
#   webhook  ~10 mesaj/gun x 30.4      = ~300 dk    (kullanima gore degisir)
#   emniyet agi 2 kosu/gun x 30.4      =  ~61 dk
#   gunluk-rapor.yml                   = ~400 dk
#   toplam                             = ~760 dk = %38
#
# Eski 30 dakikalik yoklama tek basina ~1095 dk yakiyordu (%55) ve cevap
# 30 dakika gecikebiliyordu. Webhook hem daha hizli hem daha ucuz cunku
# yalnizca GERCEKTEN mesaj oldugunda dakika yaniyor.
#
# DIKKAT: maliyet artik KULLANIMA bagli. Gunde 40 komut = ~1200 dk. Worker
# tarafinda iki fren var (asgari aralik + aylik tavan), ama sinirsiz degil.
#
# Worker kota korumasi: aylik kosu sayisi esigi asarsa Worker dispatch ATMAZ,
# dogrudan Telegram'dan "kota %X, N dakika sonra" cevabi doner. Yani bu
# workflow'un onunde bir fren var - bkz. altyapi/telegram-webhook/worker.js.

on:
  repository_dispatch:
    types: [telegram-mesaj]   # Cloudflare Worker bunu atar
  schedule:
    # EMNIYET AGI - gunde 2 kez, ~61 dk/ay. TR 09:07 ve 21:07.
    #
    # Webhook AKTIFKEN bu kosu hicbir sey yapmaz: getUpdates HTTP 409 doner
    # ve script "Webhook aktif - yoklamaya gerek yok" deyip BASARIYLA cikar.
    # Yani kurulu sistemde gunde 2 dakikalik sigorta primi.
    #
    # Webhook YOKKEN (veya Worker/Cloudflare cokmusken) eski yoklama yolu
    # devreye girer ve bekleyen mesajlar cevaplanir. Bu sayede webhook
    # kurulumu ile kod arasinda SIRA BAGIMLILIGI yok - hangisi once olursa
    # olsun bot cevap veriyor.
    #
    # Webhook aylarca sorunsuz calistiktan sonra bu blok silinebilir.
    - cron: '7 6,18 * * *'
  workflow_dispatch:          # elle tetikleme - test icin

permissions:
  contents: write             # yalnizca bot_offset.txt commit'i icin

concurrency:
  group: bot-sorgu
  cancel-in-progress: false   # iki kosu ayni offset dosyasina yazmasin

jobs:
  sorgu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/yatirim/requirements.txt

      - name: Bagimliliklar
        run: pip install -r scripts/yatirim/requirements.txt

      - name: Son durumu al
        # Rapor workflow'u sinyal-durumu.yaml ve raporlari commit ediyor.
        # Pull edilmezse bot bayat latch/rapor okur ve "son calisma" yanlis
        # cikar. Ayrica offset commit'i catisir.
        run: git pull --rebase --autostash

      - name: Sorgulari cevapla
        # Webhook yolu: komut dispatch yukunden gelir, getUpdates CAGRILMAZ
        # (webhook aktifken 409 doner). Elle tetiklemede yuk olmadigi icin
        # eski yoklama yoluna dusulur - webhook henuz kurulmamissa da
        # calissin diye.
        #
        # Komut metni kabuk degiskeni uzerinden geciyor, `${{ }}` ile
        # dogrudan komut satirina GOMULMUYOR: kullanicinin yazdigi metin
        # dogrudan gomulseydi kabuk enjeksiyonu olurdu.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_IZINLI_CHAT_ID: ${{ secrets.TELEGRAM_IZINLI_CHAT_ID }}
          KOMUT: ${{ github.event.client_payload.komut }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          if [ -n "$KOMUT" ]; then
            python scripts/yatirim/bot_sorgu.py --komut "$KOMUT" --chat-id "$CHAT_ID"
          else
            python scripts/yatirim/bot_sorgu.py --zorla
          fi

      - name: Offset defterini commit et
        # YALNIZCA offset dosyasi. `git add 04-projects/yatirim-sistemi/`
        # yazmak, bot kosusunun rapor workflow'unun urettigi dosyalari da
        # commit etmesine yol acardi - iki workflow ayni dosyalari
        # itistirir ve rebase catismasi cikar.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-projects/yatirim-sistemi/simulasyon/bot_offset.txt
          if git diff --staged --quiet; then
            echo "Offset degismedi, commit atlandi."
          else
            git commit -m "chore: bot offset $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      # Hata bildirimi YOK - bilincli.
      #
      # Sorgu botu yarim saatte bir calisiyor. Gecici bir ag hatasinda her
      # kosuda Telegram'a "bot basarisiz" mesaji dusmesi, botun cevaplamasi
      # gereken sohbeti kendi hata mesajlariyla doldurur. Kosu basarisiz
      # olursa Actions sekmesinde kirmizi gorunur; sorgu botunun sessiz
      # kalmasinin bedeli, rapor workflow'unun sessiz kalmasi kadar agir
      # degil - kullanici zaten oradadir, tekrar sorar.

name: Yatirim Takibi

# TEK workflow. Hangi piyasanin acik oldugunu ve bu kosunun ne yapacagini
# (tarama / gun sonu / brifing) script belirler - bkz. scripts/yatirim/piyasa.py
# ve 04-projects/yatirim-sistemi/bildirim.yaml -> takvim.
#
# Ayri workflow'lar (kripto/BIST/ABD) her biri ayri checkout + pip install
# ederdi; Actions dakika butcesi ikiye katlanirdi.
#
# DAKIKA BUTCESI (private repo, GitHub Free = 2000 dk/ay).
#
# OLCULEN kosu suresi: 31-40 sn (gh run list, 6 kosu). Faturalama kosu
# basina YUKARI YUVARLANIR, yani her kosu 1 DAKIKA yazilir - 2 degil.
# Tahmine dayali eski hesap butceyi iki katina cikarmisti.
#
#   2 saatlik grid  12/gun x 30.4 = 365 kosu
#   gun sonu         1/gun        =  30 kosu
#   brifing          1/hafta      =   4 kosu
#   ~400 kosu x 1 dk              = ~400 dk/ay = butcenin %20'si
#
# 1 saatlik grid ~765 dk (%38) - rahat. 30 dakikalik grid ~1495 dk (%75)
# ama RISKLI: kosu 60 saniyeyi asarsa fatura 2 dk'ya ciker ve toplam
# ~2990 dk olur, butce asilir. 35 saniyelik kosuda 25 saniyelik pay var.
#
# Sikligi artirmanin tek faydasi ilk hareketi ne kadar gec duydugundur:
# bekleme suresi (FAZ 4) zaten sembol basina gunde ~1 sinyalle siniriyor,
# yani daha sik taramak sinyal SAYISINI artirmaz.

on:
  schedule:
    # Saatler UTC. Turkiye kalici UTC+3, yaz saati yok.
    #
    # Dakika 7, 0 DEGIL: GitHub zamanlanmis kosulari "best effort" calistirir
    # ve saat basi kuyrugun en kalabalik oldugu andir. Tam saatte tetiklenen
    # is 10-40 dakika gecikebiliyor; 7. dakika bedava gecikme sigortasi.
    - cron: '7 */2 * * *'     # 2 saatte bir, 7 gun - piyasa taramasi
    - cron: '30 20 * * *'     # 23:30 TR - gun sonu ozeti (esik tam 23:30)
    - cron: '0 6 * * 1'       # 09:00 TR Pazartesi - acilis brifingi
  workflow_dispatch:          # Actions sekmesinden elle tetiklenebilir

permissions:
  contents: write             # uretilen raporu repoya geri commit etmek icin
  actions: read               # kosu suresi izleme (kosu_suresi.py)

concurrency:
  group: gunluk-rapor
  cancel-in-progress: false   # ust uste calisip ayni dosyaya yazmasin

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/yatirim/requirements.txt

      - name: Bagimliliklar
        run: pip install -r scripts/yatirim/requirements.txt

      - name: Testler
        # Cevrimdisi testler. Kirikken rapor uretip Telegram'a yollamayalim.
        run: python -m unittest discover -s scripts/yatirim -p "test_*.py" -v

      - name: Worker testleri
        # Node ubuntu-latest'te ONCEDEN KURULU, `node --test` yerlesik -
        # ek kurulum ve bagimlilik yok, ~0.2 saniye. Worker yetki ve kota
        # frenlerini tutuyor; kirik bir fren sessizce kota tuketir.
        run: node --test altyapi/telegram-webhook/worker.test.js

      - name: Rapor uret ve Telegram'a gonder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/yatirim/main.py --sim --telegram

      - name: Karar sonuclarini olc
        # Vadesi gelen 5/10/15/20/25/30. gun kontrollerini doldurur.
        # Kacan gunler gecmis fiyat serisinden geriye donuk tamamlanir.
        run: python scripts/yatirim/karar_takip.py

      # NOT: vault gozden gecirme burada CALISTIRILMAZ.
      # CI checkout'u .gitignore beyaz listesi yuzunden eksik vault icerir:
      # 03-wiki, 02-sources, 05-daily repoda yok. Denetci burada calissaydi
      # 00-sistem.md'deki 13 wikilink'in hepsini "kirik" raporlardi.
      # Vault denetimi TAM vault gerektirir -> yerel haftalik gorevle calisir
      # (IkinciBeyin-VaultDenetim). Bkz. scripts/vault/gozden_gecir.py

      - name: Durumu ve raporu repoya commit et
        # Yalnizca rapor degil: sinyal-durumu.yaml (histerezis latch'i, bekleme
        # saati, gunluk sayac), gonderilen.log (idempotency) ve
        # bildirim-kuyrugu.yaml (sessiz saatte biriken bildirimler) da commit
        # EDILMEK ZORUNDA. Actions her kosuda temiz checkout aliyor; commit
        # edilmezse latch her kosuda kapali baslar, ayni mesaj tekrar gider ve
        # gece biriken uyarilar kaybolur.
        #
        # `git pull --rebase` sart: 2 saatlik gridde iki kosu arasinda yerel
        # bir push olmus olabilir.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-projects/yatirim-sistemi/
          if git diff --staged --quiet; then
            echo "Degisiklik yok, commit atlanti."
          else
            git commit -m "chore: yatirim takibi $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Kosu suresini izle
        # 60 saniyeyi asan kosu 1 degil 2 dakika faturalanir, yani butce bir
        # anda IKIYE katlanir - ve bu sessizce olur. Esik 50 sn, uyari gunde
        # bir kez (gunluk idempotency anahtari).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/yatirim/kosu_suresi.py

      - name: Hata cozuldu bildirimi
        # Kosu BASARILI bittiyse aktif hata kaydi temizlenir ve (varsa)
        # "cozuldu" mesaji gider. Bu adim olmasaydi ariza duzelse bile durum
        # dosyasinda asili kalir ve bir sonraki FARKLI hata "ayni hata"
        # sanilip bastirilabilirdi.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/yatirim/hata_takip.py --kod ""

      - name: Hata bildirimi
        if: failure()
        # AYNI hata 24 saatte bir kez bildirilir (hata_takip.py). Iki saatlik
        # gridde kalici bir ariza gunde 12 ayni mesaj uretiyordu; sonuc
        # paradoksaldi - bildirim ne kadar cok gelirse o kadar az okunuyor
        # ve gercekten yeni bir ariza gurultunun icinde kayboluyordu.
        #
        # Kod SABIT bir etiket ("rapor-basarisiz"), mesaj metni degil: metinde
        # kosu URL'i var ve o her kosuda degisir - metne bakan bir
        # karsilastirma her seferinde "yeni hata" gorurdu.
        #
        # main.py BILINEN bir engelde (bayat hurdle, ucgenleme durdurma)
        # kendi ozel kodunu bildirip `hata-kodu.txt` birakir. O dosya varsa
        # burasi SUSAR: yoksa ayni ariza icin iki mesaj gider ve - daha
        # kotusu - iki farkli kod her kosuda birbirini "yeni hata" yapip
        # bastirmayi tumden etkisiz kilardi.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALISMA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -s hata-kodu.txt ]; then
            echo "main.py zaten bildirdi ($(cat hata-kodu.txt)), atlaniyor."
            exit 0
          fi
          python scripts/yatirim/hata_takip.py \
            --kod "rapor-basarisiz" \
            --mesaj "<b>Yatirim raporu BASARISIZ</b>
          Gunluk calisma hata verdi, rapor uretilmedi.
          Detay: $CALISMA"

      - name: Hata durumunu commit et
        # HER ZAMAN calisir (basarili da basarisiz da). Commit edilmezse
        # Actions'in temiz checkout'u yuzunden her kosu "yeni hata" sanir ve
        # bastirma hicbir zaman devreye girmez.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-projects/yatirim-sistemi/simulasyon/hata-durumu.yaml || true
          if git diff --staged --quiet; then
            echo "Hata durumu degismedi."
          else
            git commit -m "chore: hata durumu $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

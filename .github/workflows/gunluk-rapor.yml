name: Yatirim Takibi

# TEK workflow. Hangi piyasanin acik oldugunu ve bu kosunun ne yapacagini
# (tarama / gun sonu / brifing) script belirler - bkz. scripts/yatirim/piyasa.py
# ve 04-projects/yatirim-sistemi/bildirim.yaml -> takvim.
#
# Ayri workflow'lar (kripto/BIST/ABD) her biri ayri checkout + pip install
# ederdi; Actions dakika butcesi ikiye katlanirdi.
#
# DAKIKA BUTCESI (private repo, GitHub Free = 2000 dk/ay, her kosu yukari
# yuvarlanir):
#   2 saatlik grid  12/gun x 30.4 = 365 kosu
#   gun sonu         1/gun        =  30 kosu
#   brifing          1/hafta      =   4 kosu
#   ~399 kosu x ~2 dk             = ~800 dk/ay = butcenin %40'i
#
# 1 saatlik gride cikarilirsa ~1530 dk (%77) - kosu suresi 3 dakikaya cikarsa
# butce asilir. 30 dakikalik grid ~2980 dk (%149), MUMKUN DEGIL.
#
# Sikligi artirmanin tek faydasi ilk hareketi ne kadar gec duydugundur:
# bekleme suresi (FAZ 4) zaten sembol basina gunde ~1 sinyalle siniriyor,
# yani daha sik taramak sinyal SAYISINI artirmaz.

on:
  schedule:
    # Saatler UTC. Turkiye kalici UTC+3, yaz saati yok.
    - cron: '0 */2 * * *'     # 2 saatte bir, 7 gun - piyasa taramasi
    - cron: '30 20 * * *'     # 23:30 TR - gun sonu ozeti
    - cron: '0 6 * * 1'       # 09:00 TR Pazartesi - acilis brifingi
  workflow_dispatch:          # Actions sekmesinden elle tetiklenebilir

permissions:
  contents: write             # uretilen raporu repoya geri commit etmek icin

concurrency:
  group: gunluk-rapor
  cancel-in-progress: false   # ust uste calisip ayni dosyaya yazmasin

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/yatirim/requirements.txt

      - name: Bagimliliklar
        run: pip install -r scripts/yatirim/requirements.txt

      - name: Testler
        # Cevrimdisi testler. Kirikken rapor uretip Telegram'a yollamayalim.
        run: python -m unittest discover -s scripts/yatirim -p "test_*.py" -v

      - name: Rapor uret ve Telegram'a gonder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/yatirim/main.py --sim --telegram

      - name: Karar sonuclarini olc
        # Vadesi gelen 5/10/15/20/25/30. gun kontrollerini doldurur.
        # Kacan gunler gecmis fiyat serisinden geriye donuk tamamlanir.
        run: python scripts/yatirim/karar_takip.py

      # NOT: vault gozden gecirme burada CALISTIRILMAZ.
      # CI checkout'u .gitignore beyaz listesi yuzunden eksik vault icerir:
      # 03-wiki, 02-sources, 05-daily repoda yok. Denetci burada calissaydi
      # 00-sistem.md'deki 13 wikilink'in hepsini "kirik" raporlardi.
      # Vault denetimi TAM vault gerektirir -> yerel haftalik gorevle calisir
      # (IkinciBeyin-VaultDenetim). Bkz. scripts/vault/gozden_gecir.py

      - name: Durumu ve raporu repoya commit et
        # Yalnizca rapor degil: sinyal-durumu.yaml (histerezis latch'i, bekleme
        # saati, gunluk sayac), gonderilen.log (idempotency) ve
        # bildirim-kuyrugu.yaml (sessiz saatte biriken bildirimler) da commit
        # EDILMEK ZORUNDA. Actions her kosuda temiz checkout aliyor; commit
        # edilmezse latch her kosuda kapali baslar, ayni mesaj tekrar gider ve
        # gece biriken uyarilar kaybolur.
        #
        # `git pull --rebase` sart: 2 saatlik gridde iki kosu arasinda yerel
        # bir push olmus olabilir.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-projects/yatirim-sistemi/
          if git diff --staged --quiet; then
            echo "Degisiklik yok, commit atlanti."
          else
            git commit -m "chore: yatirim takibi $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Hata bildirimi
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "scripts/yatirim")
          from notify import TelegramHatasi, mesaj_gonder

          calisma = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          try:
              mesaj_gonder(
                  "<b>Yatirim raporu BASARISIZ</b>\n"
                  "Gunluk calisma hata verdi, rapor uretilmedi.\n"
                  f"Detay: {calisma}"
              )
          except TelegramHatasi as hata:
              print(f"Hata bildirimi de gonderilemedi: {hata}", file=sys.stderr)
          PY

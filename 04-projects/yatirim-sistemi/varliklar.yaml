# Izlenen varliklar ve hedef dagilim.
# Sembol degistirmek/eklemek icin sadece bu dosyayi duzenle, kod dokunma.
#
# Alanlar:
#   sembol  : Yahoo Finance sembolu (BIST icin .IS soneki)
#   ad      : okunabilir isim
#   sinif    : hedef_dagilim icindeki anahtarlardan biri
#   kur      : TRY veya USD (USD olanlar usdtry ile TL'ye cevrilir)
#   carpan   : ham fiyati istenen birime cevirir (varsayilan 1.0)
#              ornek: ons -> gram icin 1/31.1035 = 0.0321507
#   izleme   : true ise sadece takip edilir, portfoy agirligina girmez

ayarlar:
  kur_sembolu: USDTRY=X
  gecmis_gun: 365          # risk metrikleri bu pencereden hesaplanir
  islem_gunu_yil: 252      # yalnizca fallback; carpan normalde veriden turetilir

# Karar esikleri. Simulasyon modunda AGRESIF ayarlandi.
# Gercek parayla calisirken komisyon maliyeti nedeniyle gevsetilmeli.
# Karar esikleri. HEPSI KESIR (0.03 = 3 puan, 0.20 = %20).
#
# Dosyanin tamami kesir kullanir; tek bir alani "3" veya "20" diye yazmak
# esigin 100 katina cikmasi demektir ve hicbir hata vermez.
#
# Her esik bir BANT: sinyal tetikte acilir, geri donuse inmeden kapanmaz.
# Tek esikli kural, deger esigin etrafinda salinirken her kosuda ters sinyal
# uretir; sen komisyon odersin, pozisyon ayni kalir.
esikler:
  # Rebalancing sapmasi. Tetik 3 puan, geri donus 1.5 puan.
  # 0.05 (muhafazakar) -> 0.03 (agresif): daha sik duzeltme, daha cok komisyon.
  rebalancing_sapma: 0.03
  rebalancing_geri_donus: 0.015

  # Kisma karari IKI kosulun BIRDEN saglanmasini ister:
  #   1) risk katkisi tavani asmali
  #   2) beta (katki/agirlik) tavani asmali
  #
  # Tek basina katki yetmez: 6 pozisyonda ortalama katki %16.7'dir, birilerinin
  # %20'yi asmasi matematiksel zorunluluk. Ham katkiyi kovalamak, parasindan
  # AZ risk tasiyan verimli varliklari (ornegin QQQ, beta 0.85) sattirir.
  #
  # Bant yalnizca katkiya uygulanir: beta = katki/agirlik oldugu icin katki
  # bandi betanin salinimini da sonumler. Beta tavani her iki yonde de duz esik.
  risk_katkisi_ust: 0.20
  risk_katkisi_geri_donus: 0.17
  risk_beta_ust: 1.50

  # HAFTA SONU: tum esikler bu carpanla genisler (Cumartesi-Pazar, TR takvimi).
  #
  # Sebep kripto likiditesinin ince olmasi: ayni buyuklukteki emir hafta sonu
  # daha cok fiyat oynatir, yani hafta sonu gorulen sapma hafta ici kadar
  # guvenilir bir sinyal degil.
  #
  # Genisletme TUM siniflara uygulanir ama pratikte yalnizca kriptoyu isirir:
  # BIST ve Nasdaq kapali oldugu icin hafta sonu tum siniflarin agirligini
  # oynatan tek sey kriptonun kendisidir.
  #
  # Normal esigi asip genis esigi ASMAYAN sinyal kaybolmaz - islem onerisi
  # yerine UYARI olarak gelir. Yani hafta sonu bilgi kesilmez, otomatik islem
  # icin cita yukselir.
  hafta_sonu_carpani: 1.5

# Ayni sembolde iki sinyal arasindaki asgari sure.
#
# Sure son URETILEN sinyalden olculur (sinyal-durumu.yaml), islem defterinden
# DEGIL: defter yalnizca tarih tutar, "24 saat" gun cozunurlugunde tanimsizdir.
#
# NEDEN 24 DEGIL 20: rapor su an gunde bir kez calisiyor (Actions 16:00 UTC).
# Iki kosu arasi tam 24.0 saat, ustelik Actions cron'u 5-30 dakika kayabiliyor.
# Esik 24 olsaydi kosular arasi sure bazen 23.7 bazen 24.3 saat cikar ve
# gunlerin yaklasik yarisinda TUM sembol sinyalleri sessizce dusurulurdu.
# 20 saat gunluk kadansta hicbir seyi engellemez (dogru davranis: gunde bir
# kosuda ayni sembol churn'u zaten olamaz) ama kadans saatlige cikarildigi an
# devreye girer. Kadansi artirirken bu degeri de 24'e cikar.
bekleme:
  ayni_sembol_saat: 20

# Gunluk sinyal tavani. Asilirsa o gun HICBIR sinyal uretilmez ve Telegram'a
# "ANORMAL ISLEM YOGUNLUGU" uyarisi gider.
#
# Amac tek bir bozuk girdinin (yanlis fiyat, kacirilan bedelsiz, kur hatasi)
# toplu islem onerisine donusmesini engellemek. 11 varlikli bir portfoyde
# gunde 6 sinyal zaten portfoyun yarisini elden gecirmek demek; 6'yi asan
# sayi tavsiye degil, ariza belirtisidir.
devre_kesici:
  gunluk_maks_islem: 6

# Bayatlik esikleri - varlik sinifi bazinda.
#
# BIRIM: kacirilan ISLEM GUNU. Takvim gunu DEGIL. Bir sembolun bayatligi,
# kendi sinifindaki diger sembollerin islem gordugu ama onun gormedigi gun
# sayisiyla olculur. Takvim gunu sayilsaydi her Pazartesi tum BIST hisseleri
# "3 gundur bayat" cikardi (Cuma -> Pazartesi = 3 takvim gunu, 1 islem gunu).
#
# NEDEN DAKIKA/SAAT YOK: fiyat verisi GUNLUK bar (interval="1d"). Gun altinda
# cozunurluk yok. Sartnamedeki "kripto 15 dakika" ve "doviz 1 saat" esikleri
# gunluk barda tek bir seye karsilik gelir: "en son barda veri OLMALI" = 0.
# Intraday veriye gecilirse bu alanlar kesirli gune cevrilir (15dk = 0.0104).
bayatlik_esikleri:
  varsayilan: 7            # sinifi tanimsiz sembol icin guvenlik agi
  kripto: 0                # 7/24 acik, bar atlamasi = veri kesintisi
  bist: 1                  # 1 islem gunu
  nasdaq: 1                # sartnamedeki "abd"
  maden: 1                 # sartnamedeki "emtia"

# Kurumsal olay suphesi otomatik tespiti.
# Kayitli olmayan bedelsiz/split, fiyati bir gunde sicratir ve sistem bunu
# gercek kayip sanip yanlis deger uretir. Supheli sembolun degerlemesi DURUR.
kurumsal_olay:
  getiri_esigi: 0.25       # |gunluk getiri| bunu asarsa suphe
  hacim_carpani: 1.5       # hacim medyanin bu kati ustundeyse GERCEK hareket
  hacim_penceresi: 20      # medyan hacim kac gunden hesaplanir
  tarama_gunu: 5           # yalnizca son N gun taranir, tarihi olaylar degil
  # Supheli sembol RISK hesabinda ne olsun:
  #   disla  - seri hic girmesin (varsayilan)
  #   duzelt - kurumsal-olaylar.yaml'daki oranla geri-duzeltilsin; defterde
  #            oran YOKSA yine dislanir (uydurma oran, sisirilmis
  #            volatiliteden kotudur)
  risk_modu: disla
  gozlem_dusus_esigi: 0.20 # dislama veri setinin bu kadarindan fazlasini
                           # goturuyorsa "volatilite tahmini guvenilirligi
                           # dustu" uyarisi basilir

# Dis veri kaynaklari ve ucgenleme.
#
# ROL DAGILIMI - karistirilmamali:
#   BTCTurk   : kripto DEGERLEME fiyati (TL cifti dogrudan, cift cevrim yok)
#   CoinGecko : yalnizca DOGRULAMA. Degerlemeye asla girmez.
#   TCMB      : USD/TRY birincil. Yahoo USDTRY=X yedek.
#
# BTCTurk ticker ANLIK fiyattir, gecmis seri VERMEZ. Korelasyon/volatilite
# hala Yahoo'nun 365 gunluk serisinden gelir. Yani kriptonun degeri
# BTCTurk'ten, getirisi Yahoo'dan hesaplanir.
veri_kaynaklari:
  btcturk:
    url: "https://api.btcturk.com/api/v2/ticker"
    ciftler:
      BTC-USD: BTCTRY
      ETH-USD: ETHTRY
  coingecko:
    url: "https://api.coingecko.com/api/v3/simple/price"
    kimlikler:
      BTC-USD: bitcoin
      ETH-USD: ethereum
  tcmb:
    # ANAHTAR GEREKTIRMEZ. Eski `evds2.../service/evds/series=...` yolu
    # (anahtar isteyen) 2026 arayuz gecisiyle JSON dondurmeyi birakti, artik
    # web uygulamasinin HTML'ini veriyor. Yeni uc ayni kuru kimliksiz veriyor.
    url: "https://evds3.tcmb.gov.tr/igmevdsms-dis/sk-seriler"
    # Bu uc yalnizca "sik kullanilan seriler"i doner; icindeki tek USD serisi
    # EFEKTIF alistir. Doviz alis (TP.DK.USD.A) ile farki binde 1 civari -
    # %3'luk prim esigi yaninda onemsiz.
    seri: "TP.DK.USD.A.EF.YTL"
    # TCMB yalnizca IS GUNU ~15:30'da kur yayimlar. Hafta sonu yeni kur yok.
    # 1 gunden eski kur bayat sayilir ve Yahoo'ya dusulur - yoksa Pazar gunu
    # olculen sey "TR primi" degil, kurun bayatligi olur.
    bayatlik_gun: 1
  ucgenleme:
    btcturk_bayatlik_dakika: 15
    prim_esigi: 0.03           # ustunde TR primi olarak kaydedilir + uyari
    durdurma_esigi: 0.08       # ustunde rapor URETILMEZ (uc kaynak da tazeyse)

# ==========================================================================
# UC SINIFLI MALIYET MODELI
# ==========================================================================
#
# TEMEL KURAL: bilinmeyen kalem `null` birakilir, SIFIR YAZILMAZ.
# Bilinmeyen maliyeti sifir saymak sessiz basarisizligin en tehlikeli
# turudur: sistem hata vermez, yalnizca karsiz bir islemi karli gosterir.
#
# `null` bir kalem varsa:
#   - rapor URETILIR (veri kaybi yok)
#   - "EKSIK MALIYET KALEMI" uyarisi basilir
#   - O VARLIK ICIN ISLEM SINYALI URETILMEZ (rebalancing + kisma)
#
# SIFIR ile NULL farki:
#   0.0  = "olcup sifir buldum" (hisse senedinin fon gider orani yoktur)
#   null = "bilmiyorum"          (kur spread'i platformdan sorulmadi)
#
# Kalem KAPSAM DISI ise iki bayrak kullanilir, boylece "yok" ile
# "bilinmiyor" karistirilmaz:
#   kur_cevrimi: false  -> kur spread'i ve kambiyo vergisi UYGULANMAZ
#                          (TL hesaptan TL hisse alirken cevrim yoktur)
#   temettu_verimi: 0.0 -> temettu odemiyor, stopaj sorusu duser
maliyet:
  # Varlik sinifi -> islem maliyeti profili. Haritada olmayan sinif
  # "profil tanimsiz" sayilir ve o sinifin tum sembolleri bloklanir.
  sinif_profili:
    bist: bist
    nasdaq: abd_midas
    kripto: kripto_btcturk
    maden: emtia_bilinmiyor

  islem:
    bist:
      komisyon_tip: oransal
      komisyon_oran:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # temel deger islemler.yaml komisyon_orani ile ayni
        iyimser: 0.001
        temel: 0.0015
        kotumser: 0.0025
      kur_cevrimi: false           # TL hesap, TL hisse - cevrim yok
      # VARSAYILAN spread - sembol_spreadi'nde listelenmeyen BIST
      # sembolleri bunu kullanir. Likidite bagimli oldugu icin aralik
      # genis: BIST30'da dar, kucuk hissede cok daha genis.
      menkul_spread:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        iyimser: 0.0005
        temel: 0.002
        kotumser: 0.006

    abd_midas:
      komisyon_tip: sabit
      komisyon_usd: 1.5            # DOGRULANACAK (resmi ucret tarifesi)
      kur_cevrimi: true
      kur_spread_tek_yon:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # TEK YON - gidis-donus hesabinda 2 ile carpilir
        iyimser: 0.0015
        temel: 0.004
        kotumser: 0.009
      kambiyo_vergisi:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        iyimser: 0.0
        temel: 0.002
        kotumser: 0.01
      menkul_spread: 0.00002       # QQQ/SPY, yuksek likidite

    kripto_btcturk:
      komisyon_tip: oransal
      komisyon_oran:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # BTCTurk kademeli tarife
        iyimser: 0.0
        temel: 0.0015
        kotumser: 0.0035
      kur_cevrimi: false           # TRY cifti dogrudan alinir (BTCTRY)
      menkul_spread:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE EKLEDI - Dodo aralik vermedi; emir defteri derinligi
        iyimser: 0.0005
        temel: 0.002
        kotumser: 0.005

    emtia_bilinmiyor:
      # GC=F/SI=F bir vadeli sozlesme fiyatidir; gram altin fiilen hangi
      # platformdan alinacagi kararlasmadi. Platform belli olunca bu blok
      # gercek tarifeyle degistirilir.
      komisyon_tip: oransal
      komisyon_oran:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # Platform belli degil, aralik uc secenegi birden kapsiyor:
        # kuyumcu/banka altin hesabinda ayri komisyon genelde YOK (0),
        # araci kurum uzerinden sertifika/ETF'te hisse benzeri (~0.0015),
        # bazi platformlarda daha yuksek.
        iyimser: 0.0
        temel: 0.0015
        kotumser: 0.004

      # YAPISAL SECIM, olcum DEGIL - aralik alamaz, bu yuzden tek deger.
      # VARSAYIM: gram altin TL ile TR platformundan alinir. O durumda
      # ayri bir kur cevrimi yoktur; saticinin TL fiyatina gomulu kur
      # marji menkul_spread araliginin (0.0010-0.0080) icinde kalir.
      # USD hesaptan ABD altin ETF'i alinacaksa BU DEGER true OLMALI ve
      # kur_spread_tek_yon + kambiyo_vergisi doldurulmali.
      kur_cevrimi: false
      menkul_spread:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # enstrumana bagli: ETF mi fiziki mi henuz belli degil
        iyimser: 0.001
        temel: 0.003
        kotumser: 0.008


  # Sembol bazli menkul kiymet spread'i. Profildeki degeri EZER.
  # Listede OLMAYAN sembol profilin varsayilanini kullanir.
  #
  # Neden sembol bazli: tek global spread, likiditesi cok farkli hisseleri
  # ayni kefeye koyar. BIST30'da emir defteri derin ve spread dar; kucuk
  # hissede birkac kat genis olabilir. Tek deger, buyuklerde maliyeti
  # abartip gereksiz "ekonomik degil" karari uretir.
  #
  # CLAUDE EKLEDI - Dodo sembol bazli deger vermedi, yalnizca "buyuklerde
  # dar" dedi. Asagidaki BIST30 araliklari o kurala gore turetildi,
  # OLCULMEDI. Gercek spread emir defterinden okunur.
  sembol_spreadi:
    THYAO.IS:
      tahmin: true
      kaynak: "olculmedi-genis-aralik"
      iyimser: 0.0005
      temel: 0.001
      kotumser: 0.002
    ASELS.IS:
      tahmin: true
      kaynak: "olculmedi-genis-aralik"
      iyimser: 0.0005
      temel: 0.001
      kotumser: 0.002
    TUPRS.IS:
      tahmin: true
      kaynak: "olculmedi-genis-aralik"
      iyimser: 0.0005
      temel: 0.001
      kotumser: 0.002
    GARAN.IS:
      tahmin: true
      kaynak: "olculmedi-genis-aralik"
      iyimser: 0.0005
      temel: 0.001
      kotumser: 0.002
    XU100.IS:
      tahmin: true
      kaynak: "olculmedi-genis-aralik"
      iyimser: 0.0005
      temel: 0.001
      kotumser: 0.002

  # Tasima maliyeti: tuttugun her gun isler, bilesiktir. Sembol bazinda.
  # Listede OLMAYAN sembol "beyan edilmemis" sayilir ve bloklanir.
  tasima:
    THYAO.IS:
      gider_orani_yillik: 0.0      # hisse senedi, fon degil - yapisal sifir
      temettu_verimi:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # THY tarihsel olarak nakit temettu dagitmiyor; kotumser uc
        # politika degisikligi ihtimali icin acik birakildi.
        iyimser: 0.0
        temel: 0.0
        kotumser: 0.02
      temettu_stopaji:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # TR gercek kisi temettu stopaji. Oran mevzuatla degisiyor -
        # guncel tebligden DOGRULA, aralik bu belirsizlik icin genis.
        iyimser: 0.1
        temel: 0.15
        kotumser: 0.2
    ASELS.IS:
      gider_orani_yillik: 0.0
      temettu_verimi:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # Savunma sanayii, karin buyuk kismi yatirima donuyor -
        # dagitim var ama dusuk.
        iyimser: 0.0
        temel: 0.01
        kotumser: 0.03
      temettu_stopaji:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # TR gercek kisi temettu stopaji. Oran mevzuatla degisiyor -
        # guncel tebligden DOGRULA, aralik bu belirsizlik icin genis.
        iyimser: 0.1
        temel: 0.15
        kotumser: 0.2
    TUPRS.IS:
      gider_orani_yillik: 0.0
      temettu_verimi:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # Rafineri: yuksek ve COK oynak dagitici. Rafineri marji iyi
        # gecen yilin verimi kotu yilin uc katina cikabiliyor.
        iyimser: 0.02
        temel: 0.06
        kotumser: 0.15
      temettu_stopaji:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # TR gercek kisi temettu stopaji. Oran mevzuatla degisiyor -
        # guncel tebligden DOGRULA, aralik bu belirsizlik icin genis.
        iyimser: 0.1
        temel: 0.15
        kotumser: 0.2
    GARAN.IS:
      gider_orani_yillik: 0.0
      temettu_verimi:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # Banka: duzenli dagitici ama oran BDDK/kar dagitim
        # kisitlarina bagli olarak yillara gore degisiyor.
        iyimser: 0.01
        temel: 0.04
        kotumser: 0.08
      temettu_stopaji:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE TAHMINI - Dodo aralik vermedi, model bilgisinden
        # TR gercek kisi temettu stopaji. Oran mevzuatla degisiyor -
        # guncel tebligden DOGRULA, aralik bu belirsizlik icin genis.
        iyimser: 0.1
        temel: 0.15
        kotumser: 0.2
    QQQ:
      gider_orani_yillik: 0.0020   # Invesco QQQ gider orani %0.20
      temettu_verimi:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        iyimser: 0.008
        temel: 0.012
        kotumser: 0.016
      temettu_stopaji:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE EKLEDI - Dodo aralik vermedi (CVOA + ABD stopaji)
        iyimser: 0.1
        temel: 0.15
        kotumser: 0.3
    AAPL:
      gider_orani_yillik: 0.0
      temettu_verimi:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        iyimser: 0.008
        temel: 0.012
        kotumser: 0.016
      temettu_stopaji:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE EKLEDI - Dodo aralik vermedi (CVOA + ABD stopaji)
        iyimser: 0.1
        temel: 0.15
        kotumser: 0.3
    NVDA:
      gider_orani_yillik: 0.0
      temettu_verimi:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        iyimser: 0.008
        temel: 0.012
        kotumser: 0.016
      temettu_stopaji:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # CLAUDE EKLEDI - Dodo aralik vermedi (CVOA + ABD stopaji)
        iyimser: 0.1
        temel: 0.15
        kotumser: 0.3
    BTC-USD:
      gider_orani_yillik: 0.0
      temettu_verimi: 0.0          # kripto temettu odemez - yapisal sifir
    ETH-USD:
      gider_orani_yillik: 0.0
      temettu_verimi: 0.0
    GC=F:
      gider_orani_yillik:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # tasima_maliyeti: ETF gider orani VEYA fiziki saklama farki.
        # Hangi enstrumanla tutuldugu kararlasmadi - aralik bu yuzden genis.
        iyimser: 0.0
        temel: 0.0025
        kotumser: 0.006
      temettu_verimi: 0.0          # fiziki maden temettu odemez
    SI=F:
      gider_orani_yillik:
        tahmin: true
        kaynak: "olculmedi-genis-aralik"
        # tasima_maliyeti: ETF gider orani VEYA fiziki saklama farki.
        # Hangi enstrumanla tutuldugu kararlasmadi - aralik bu yuzden genis.
        iyimser: 0.0
        temel: 0.0025
        kotumser: 0.006
      temettu_verimi: 0.0
    XU100.IS:
      gider_orani_yillik: 0.0
      temettu_verimi: 0.0          # endeks, satin alinmaz (izleme: true)

  # Tutma plani. Sinif bazli.
  #
  # Sistem beklenen getiri TAHMIN ETMEZ. Gerekeni HESAPLAR:
  #
  #   gereken_getiri = tl_risksiz + yillik_tasima + gidis_donus / planlanan_yil
  #
  # Bu formulun her girdisi olculebilir. Cikti "bu varligi planladigim sure
  # tutmaya deger kilmak icin yilda en az ne kazanmasi gerekir" sorusunun
  # cevabidir ve raporda varlik basina yazilir.
  #
  # `beklenen_getiri_yillik` VARSAYILANI YOKTUR ve olmayacak:
  #   null      -> gereken getiri hesaplanir ve GOSTERILIR, sinyal URETILMEZ.
  #   bir sayi  -> SENIN BEYANINDIR (kaynak: kullanici-beyani). Modelin
  #                tahmini degil; raporda kimin sayisi oldugu belli olur.
  #   beyan < gereken -> sinyal bastirilir, rapor sebebini yazar.
  #
  # Buraya bir sayi yazmak "su getiriyi bekliyorum" demektir. Sistemin bunu
  # senin yerine doldurmasi, uretmedigi bir fiyat tahminini uretiyormus gibi
  # yapmak olurdu.
  tutma:
    bist:   {planlanan_yil: 1.0, beklenen_getiri_yillik: null}
    nasdaq: {planlanan_yil: 3.0, beklenen_getiri_yillik: null}
    kripto: {planlanan_yil: 1.0, beklenen_getiri_yillik: null}
    maden:  {planlanan_yil: 5.0, beklenen_getiri_yillik: null}

  # Firsat maliyeti - hurdle rate. ZORUNLU.
  # Deger yoksa (ne canli ne yedek) RAPOR URETILMEZ: sifira gore olculen
  # her pozitif getiri "basari" gorunur, oysa gercek soru "bu pozisyon
  # parayi TL mevduatta tutmaktan iyi mi".
  firsat:
    # Canli kaynak: TCMB sk-seriler ucu, ANAHTARSIZ. Yuzde cinsinden doner.
    tcmb_serisi: "TP.TRY.MT02"     # Mevduat Faiz TL Orani (3 aya kadar vadeli)
    # BAYATLIK 7 GUN. Bu sayi her seyi belirliyor: gereken getiri, asiri
    # getiri, nakit getirisi ve sinyal kapisi. Bayat bir hurdle rate butun
    # bu kararlari SESSIZCE yanlis yapar - eksik olmasindan tehlikelidir,
    # cunku eksiklik gorunur, bayatlik gorunmez. Bayatsa RAPOR URETILMEZ.
    bayatlik_gun: 7
    # Canli okuma basarisizsa bu deger kullanilir - ama TARIHI de bayatlik
    # kontrolune girer. Tarihsiz bir yedek TAZE SAYILMAZ: elle yazilmis bir
    # sayinin ne zamandan kaldigi bilinmiyorsa guncel olduguna guvenilemez.
    tl_risksiz_yillik: 0.4791      # TCMB TP.TRY.MT02
    tl_risksiz_tarih: "2026-08-07" # serinin YAYIM tarihi, yazildigi gun degil

# Nakit modellemesi.
# Yatirilmamis TL sifir getiriyle DURMAZ; duruyormus gibi modellersen sistem
# "nakitte beklemek maliyetsiz" sanir ve gereginden fazla islem onerir.
nakit:
  getiri_kaynagi: tl_risksiz      # firsat.tl_risksiz_yillik ile ayni oran
  stopaj: null                    # BILINMIYOR - bu yuzden getiri BRUT islenir,
                                  # yani gercek net getiri daha DUSUK olacak

# Enflasyon - reel getiri sutunu icin.
# reel_getiri = (1 + nominal) / (1 + enflasyon) - 1   [CARPIMSAL]
#
# Sartname TP.FE.OKTG01 diyordu; o seri ARSIVLENMIS (son guncelleme
# 09-02-2026) ve ustelik ozel kapsamli (cekirdek) TUFE, mansetler degil.
# Guncel manset serisi TP.TUKFIY2025.GENEL fakat seri-veri ucu
# (POST /fe) WAF arkasinda - tarayici disindan cekilemiyor.
# Bu yuzden anahtarsiz sk-seriler ucundaki BEKLENTI serisi kullaniliyor;
# gerceklesen degil beklenen enflasyondur ve rapor bunu yazar.
enflasyon:
  tcmb_serisi: "TP.PKAUO.S01.E.U"  # 12 ay sonrasi yillik TUFE beklentisi (%)
  bayatlik_gun: 45                 # aylik seri
  yillik: 0.2369                   # TCMB, AGUSTOS 2026 = %23.69 (beklenti)

hedef_dagilim:
  bist: 0.30
  nasdaq: 0.25
  kripto: 0.10
  maden: 0.20
  nakit: 0.15


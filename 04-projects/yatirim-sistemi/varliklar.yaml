# Izlenen varliklar ve hedef dagilim.
# Sembol degistirmek/eklemek icin sadece bu dosyayi duzenle, kod dokunma.
#
# Alanlar:
#   sembol  : Yahoo Finance sembolu (BIST icin .IS soneki)
#   ad      : okunabilir isim
#   sinif    : hedef_dagilim icindeki anahtarlardan biri
#   kur      : TRY veya USD (USD olanlar usdtry ile TL'ye cevrilir)
#   carpan   : ham fiyati istenen birime cevirir (varsayilan 1.0)
#              ornek: ons -> gram icin 1/31.1035 = 0.0321507
#   izleme   : true ise sadece takip edilir, portfoy agirligina girmez

ayarlar:
  kur_sembolu: USDTRY=X
  gecmis_gun: 365          # risk metrikleri bu pencereden hesaplanir
  islem_gunu_yil: 252      # yalnizca fallback; carpan normalde veriden turetilir

# Karar esikleri. Simulasyon modunda AGRESIF ayarlandi.
# Gercek parayla calisirken komisyon maliyeti nedeniyle gevsetilmeli.
esikler:
  # Bir varlik sinifi hedefinden bu kadar SAPARSA rebalancing uyarisi cikar.
  # 0.05 (muhafazakar) -> 0.03 (agresif): daha sik duzeltme, daha cok komisyon.
  rebalancing_sapma: 0.03

  # Kisma karari IKI kosulun BIRDEN saglanmasini ister:
  #   1) risk katkisi tavani asmali
  #   2) beta (katki/agirlik) tavani asmali
  #
  # Tek basina katki yetmez: 6 pozisyonda ortalama katki %16.7'dir, birilerinin
  # %20'yi asmasi matematiksel zorunluluk. Ham katkiyi kovalamak, parasindan
  # AZ risk tasiyan verimli varliklari (ornegin QQQ, beta 0.85) sattirir.
  risk_katkisi_ust: 0.20
  risk_beta_ust: 1.50

# Bayatlik esikleri - varlik sinifi bazinda.
#
# BIRIM: kacirilan ISLEM GUNU. Takvim gunu DEGIL. Bir sembolun bayatligi,
# kendi sinifindaki diger sembollerin islem gordugu ama onun gormedigi gun
# sayisiyla olculur. Takvim gunu sayilsaydi her Pazartesi tum BIST hisseleri
# "3 gundur bayat" cikardi (Cuma -> Pazartesi = 3 takvim gunu, 1 islem gunu).
#
# NEDEN DAKIKA/SAAT YOK: fiyat verisi GUNLUK bar (interval="1d"). Gun altinda
# cozunurluk yok. Sartnamedeki "kripto 15 dakika" ve "doviz 1 saat" esikleri
# gunluk barda tek bir seye karsilik gelir: "en son barda veri OLMALI" = 0.
# Intraday veriye gecilirse bu alanlar kesirli gune cevrilir (15dk = 0.0104).
bayatlik_esikleri:
  varsayilan: 7            # sinifi tanimsiz sembol icin guvenlik agi
  kripto: 0                # 7/24 acik, bar atlamasi = veri kesintisi
  bist: 1                  # 1 islem gunu
  nasdaq: 1                # sartnamedeki "abd"
  maden: 1                 # sartnamedeki "emtia"

# Kurumsal olay suphesi otomatik tespiti.
# Kayitli olmayan bedelsiz/split, fiyati bir gunde sicratir ve sistem bunu
# gercek kayip sanip yanlis deger uretir. Supheli sembolun degerlemesi DURUR.
kurumsal_olay:
  getiri_esigi: 0.25       # |gunluk getiri| bunu asarsa suphe
  hacim_carpani: 1.5       # hacim medyanin bu kati ustundeyse GERCEK hareket
  hacim_penceresi: 20      # medyan hacim kac gunden hesaplanir
  tarama_gunu: 5           # yalnizca son N gun taranir, tarihi olaylar degil

# Dis veri kaynaklari ve ucgenleme.
#
# ROL DAGILIMI - karistirilmamali:
#   BTCTurk   : kripto DEGERLEME fiyati (TL cifti dogrudan, cift cevrim yok)
#   CoinGecko : yalnizca DOGRULAMA. Degerlemeye asla girmez.
#   TCMB      : USD/TRY birincil. Yahoo USDTRY=X yedek.
#
# BTCTurk ticker ANLIK fiyattir, gecmis seri VERMEZ. Korelasyon/volatilite
# hala Yahoo'nun 365 gunluk serisinden gelir. Yani kriptonun degeri
# BTCTurk'ten, getirisi Yahoo'dan hesaplanir.
veri_kaynaklari:
  btcturk:
    url: "https://api.btcturk.com/api/v2/ticker"
    ciftler:
      BTC-USD: BTCTRY
      ETH-USD: ETHTRY
  coingecko:
    url: "https://api.coingecko.com/api/v3/simple/price"
    kimlikler:
      BTC-USD: bitcoin
      ETH-USD: ethereum
  tcmb:
    # ANAHTAR GEREKTIRMEZ. Eski `evds2.../service/evds/series=...` yolu
    # (anahtar isteyen) 2026 arayuz gecisiyle JSON dondurmeyi birakti, artik
    # web uygulamasinin HTML'ini veriyor. Yeni uc ayni kuru kimliksiz veriyor.
    url: "https://evds3.tcmb.gov.tr/igmevdsms-dis/sk-seriler"
    # Bu uc yalnizca "sik kullanilan seriler"i doner; icindeki tek USD serisi
    # EFEKTIF alistir. Doviz alis (TP.DK.USD.A) ile farki binde 1 civari -
    # %3'luk prim esigi yaninda onemsiz.
    seri: "TP.DK.USD.A.EF.YTL"
    # TCMB yalnizca IS GUNU ~15:30'da kur yayimlar. Hafta sonu yeni kur yok.
    # 1 gunden eski kur bayat sayilir ve Yahoo'ya dusulur - yoksa Pazar gunu
    # olculen sey "TR primi" degil, kurun bayatligi olur.
    bayatlik_gun: 1
  ucgenleme:
    btcturk_bayatlik_dakika: 15
    prim_esigi: 0.03           # ustunde TR primi olarak kaydedilir + uyari
    durdurma_esigi: 0.08       # ustunde rapor URETILMEZ (uc kaynak da tazeyse)

# ==========================================================================
# UC SINIFLI MALIYET MODELI
# ==========================================================================
#
# TEMEL KURAL: bilinmeyen kalem `null` birakilir, SIFIR YAZILMAZ.
# Bilinmeyen maliyeti sifir saymak sessiz basarisizligin en tehlikeli
# turudur: sistem hata vermez, yalnizca karsiz bir islemi karli gosterir.
#
# `null` bir kalem varsa:
#   - rapor URETILIR (veri kaybi yok)
#   - "EKSIK MALIYET KALEMI" uyarisi basilir
#   - O VARLIK ICIN ISLEM SINYALI URETILMEZ (rebalancing + kisma)
#
# SIFIR ile NULL farki:
#   0.0  = "olcup sifir buldum" (hisse senedinin fon gider orani yoktur)
#   null = "bilmiyorum"          (kur spread'i platformdan sorulmadi)
#
# Kalem KAPSAM DISI ise iki bayrak kullanilir, boylece "yok" ile
# "bilinmiyor" karistirilmaz:
#   kur_cevrimi: false  -> kur spread'i ve kambiyo vergisi UYGULANMAZ
#                          (TL hesaptan TL hisse alirken cevrim yoktur)
#   temettu_verimi: 0.0 -> temettu odemiyor, stopaj sorusu duser
maliyet:
  # Varlik sinifi -> islem maliyeti profili. Haritada olmayan sinif
  # "profil tanimsiz" sayilir ve o sinifin tum sembolleri bloklanir.
  sinif_profili:
    bist: bist
    nasdaq: abd_midas
    kripto: kripto_btcturk
    maden: emtia_bilinmiyor

  islem:
    bist:
      komisyon_tip: oransal
      komisyon_oran: 0.0015        # islemler.yaml komisyon_orani ile ayni
      kur_cevrimi: false           # TL hesap, TL hisse - cevrim yok
      menkul_spread: 0.0010        # DOGRULANACAK, hisseye gore degisir

    abd_midas:
      komisyon_tip: sabit
      komisyon_usd: 1.5            # DOGRULANACAK (resmi ucret tarifesi)
      kur_cevrimi: true
      kur_spread_tek_yon: null     # BILINMIYOR - en buyuk bosluk, Bolum 7/2
      kambiyo_vergisi: null        # BILINMIYOR - mevzuat kontrolu gerek
      menkul_spread: 0.00002       # QQQ/SPY, yuksek likidite

    kripto_btcturk:
      komisyon_tip: oransal
      komisyon_oran: null          # BILINMIYOR - BTCTurk kademeli tarife
      kur_cevrimi: false           # TRY cifti dogrudan alinir (BTCTRY)
      menkul_spread: null          # BILINMIYOR - emir defteri derinligi

    emtia_bilinmiyor:
      # GC=F/SI=F bir vadeli sozlesme fiyatidir; gram altin fiilen hangi
      # platformdan alinacagi kararlasmadi. Platform belli olunca bu blok
      # gercek tarifeyle degistirilir.
      komisyon_tip: oransal
      komisyon_oran: null
      kur_cevrimi: null            # platform TL mi USD mi bilinmiyor
      menkul_spread: null

  # Tasima maliyeti: tuttugun her gun isler, bilesiktir. Sembol bazinda.
  # Listede OLMAYAN sembol "beyan edilmemis" sayilir ve bloklanir.
  tasima:
    THYAO.IS:
      gider_orani_yillik: 0.0      # hisse senedi, fon degil - yapisal sifir
      temettu_verimi: null         # DOGRULANACAK
      temettu_stopaji: null        # DOGRULANACAK
    ASELS.IS:
      gider_orani_yillik: 0.0
      temettu_verimi: null
      temettu_stopaji: null
    TUPRS.IS:
      gider_orani_yillik: 0.0
      temettu_verimi: null
      temettu_stopaji: null
    GARAN.IS:
      gider_orani_yillik: 0.0
      temettu_verimi: null
      temettu_stopaji: null
    QQQ:
      gider_orani_yillik: 0.0020   # Invesco QQQ gider orani %0.20
      temettu_verimi: null         # DOGRULANACAK (fon kunyesi)
      temettu_stopaji: null        # DOGRULANACAK (CVOA + ABD stopaji)
    AAPL:
      gider_orani_yillik: 0.0
      temettu_verimi: null
      temettu_stopaji: null
    NVDA:
      gider_orani_yillik: 0.0
      temettu_verimi: null
      temettu_stopaji: null
    BTC-USD:
      gider_orani_yillik: 0.0
      temettu_verimi: 0.0          # kripto temettu odemez - yapisal sifir
    ETH-USD:
      gider_orani_yillik: 0.0
      temettu_verimi: 0.0
    GC=F:
      gider_orani_yillik: 0.0
      temettu_verimi: 0.0          # fiziki maden temettu odemez
    SI=F:
      gider_orani_yillik: 0.0
      temettu_verimi: 0.0
    XU100.IS:
      gider_orani_yillik: 0.0
      temettu_verimi: 0.0          # endeks, satin alinmaz (izleme: true)

  # Firsat maliyeti - hurdle rate. ZORUNLU.
  # Deger yoksa (ne canli ne yedek) RAPOR URETILMEZ: sifira gore olculen
  # her pozitif getiri "basari" gorunur, oysa gercek soru "bu pozisyon
  # parayi TL mevduatta tutmaktan iyi mi".
  firsat:
    # Canli kaynak: TCMB sk-seriler ucu, ANAHTARSIZ. Yuzde cinsinden doner.
    tcmb_serisi: "TP.TRY.MT02"     # Mevduat Faiz TL Orani (3 aya kadar vadeli)
    bayatlik_gun: 21               # haftalik seri - 21 gun makul tolerans
    # Canli okuma basarisiz/bayat olursa bu deger kullanilir ve raporda
    # "yedek" olarak isaretlenir. Guncelleme: yukaridaki seriye bak.
    tl_risksiz_yillik: 0.4791      # TCMB TP.TRY.MT02, 07-08-2026 = %47.91

# Nakit modellemesi.
# Yatirilmamis TL sifir getiriyle DURMAZ; duruyormus gibi modellersen sistem
# "nakitte beklemek maliyetsiz" sanir ve gereginden fazla islem onerir.
nakit:
  getiri_kaynagi: tl_risksiz      # firsat.tl_risksiz_yillik ile ayni oran
  stopaj: null                    # BILINMIYOR - bu yuzden getiri BRUT islenir,
                                  # yani gercek net getiri daha DUSUK olacak

# Enflasyon - reel getiri sutunu icin.
# reel_getiri = (1 + nominal) / (1 + enflasyon) - 1   [CARPIMSAL]
#
# Sartname TP.FE.OKTG01 diyordu; o seri ARSIVLENMIS (son guncelleme
# 09-02-2026) ve ustelik ozel kapsamli (cekirdek) TUFE, mansetler degil.
# Guncel manset serisi TP.TUKFIY2025.GENEL fakat seri-veri ucu
# (POST /fe) WAF arkasinda - tarayici disindan cekilemiyor.
# Bu yuzden anahtarsiz sk-seriler ucundaki BEKLENTI serisi kullaniliyor;
# gerceklesen degil beklenen enflasyondur ve rapor bunu yazar.
enflasyon:
  tcmb_serisi: "TP.PKAUO.S01.E.U"  # 12 ay sonrasi yillik TUFE beklentisi (%)
  bayatlik_gun: 45                 # aylik seri
  yillik: 0.2369                   # TCMB, AGUSTOS 2026 = %23.69 (beklenti)

hedef_dagilim:
  bist: 0.30
  nasdaq: 0.25
  kripto: 0.10
  maden: 0.20
  nakit: 0.15

varliklar:
  # --- BIST ---
  - sembol: XU100.IS
    ad: BIST 100 Endeksi
    sinif: bist
    kur: TRY
    izleme: true
  - sembol: THYAO.IS
    ad: Turk Hava Yollari
    sinif: bist
    kur: TRY
  - sembol: ASELS.IS
    ad: Aselsan
    sinif: bist
    kur: TRY
  - sembol: GARAN.IS
    ad: Garanti BBVA
    sinif: bist
    kur: TRY
  - sembol: TUPRS.IS
    ad: Tupras
    sinif: bist
    kur: TRY

  # --- Nasdaq ---
  - sembol: QQQ
    ad: Invesco QQQ (Nasdaq 100 ETF)
    sinif: nasdaq
    kur: USD
  - sembol: AAPL
    ad: Apple
    sinif: nasdaq
    kur: USD
  - sembol: NVDA
    ad: NVIDIA
    sinif: nasdaq
    kur: USD

  # --- Kripto ---
  - sembol: BTC-USD
    ad: Bitcoin
    sinif: kripto
    kur: USD
  - sembol: ETH-USD
    ad: Ethereum
    sinif: kripto
    kur: USD

  # --- Maden (ons fiyatindan grama cevrilir) ---
  - sembol: GC=F
    ad: Altin (gram)
    sinif: maden
    kur: USD
    carpan: 0.0321507
  - sembol: SI=F
    ad: Gumus (gram)
    sinif: maden
    kur: USD
    carpan: 0.0321507

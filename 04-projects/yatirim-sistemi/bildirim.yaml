# Telegram bildirim politikasi.
#
# Bu dosya SIKLIK artisinin bedelini oder. Gunde 20 bildirim alan biri
# hicbirini okumaz; uyarilar gurultuye karisir ve sistem calisiyor gorunurken
# fiilen ise yaramaz hale gelir. Iki fren var.

hiz_siniri:
  # Saatte bu sayidan fazla mesaj cikarsa fazlasi AYRI AYRI gonderilmez;
  # bekleyenlerle birlestirilip TEK mesaj olarak yollanir.
  #
  # 5 sayisi keyfi degil: FAZ 4'un devre kesicisi gunde 6 sinyalde duruyor,
  # yani normal bir gunde toplam mesaj sayisi zaten bunun civarinda. Saatlik
  # 5, "normal gunun tamami tek saate sigsa bile gecer" demek - fren yalnizca
  # gercekten anormal durumda devreye girer.
  saatlik_maks_mesaj: 5

sessiz_saatler:
  # YEREL saat (TR, kalici UTC+3). Bu aralikta bildirim GONDERILMEZ,
  # bildirim-kuyrugu.yaml icinde birikir ve bitis saatinden sonraki ilk
  # kosuda tek mesaj olarak gider.
  #
  # Kripto 7/24 acik oldugu icin gece sinyali teknik olarak mumkun; ama gece
  # 03:00'te gelen bir bildirim ya uykuyu bozar ya sabaha kadar okunmaz.
  # Ikinci durumda biriktirmek zaten dogru davranis.
  #
  # Bitis 08:00 secildi: Pazartesi acilis brifingi TR 09:00'da, BIST 10:00'da
  # aciliyor. Sessizlik 08:00'de bitmezse brifing hep birikmis gelir.
  baslangic: "01:00"
  bitis: "08:00"

  # Bu tipler sessiz saatte de GONDERILIR, birikmez.
  #
  # NEDEN: 01:00-08:00 arasinda BIST de Nasdaq da kapali. O saatte islem
  # sinyali uretebilen tek sey kripto - ve kripto sinyalini sabaha
  # biriktirmek onu islem olarak degersiz kilar; fiyatin 8 saat sonra
  # orada olacaginin garantisi yok. Biriken bir "AL" mesaji, tavsiye degil
  # kacirilan firsatin tutanagidir.
  #
  # Mesaj yagmuru riski yok: bekleme suresi (varliklar.yaml -> bekleme)
  # sembol basina 20 saatte bir sinyalle siniriyor ve gece acik yalnizca
  # 2 kripto varligi var. Teorik tavan: gecede 2 mesaj.
  #
  # Gece hic uyanmak istemiyorsan bu listeyi bos birak ([]) - o zaman islem
  # sinyali de sabah 08:00'den sonraki ilk kosuda toplu gelir.
  istisna_tipler: ["islem"]

# Hangi saatte ne yapilir. TEK workflow var; hangi piyasanin acik oldugunu
# script bu tabloya bakarak karar verir. Ayri workflow'lar olsaydi her biri
# ayri checkout + pip install ederdi - Actions dakikasi ikiye katlanirdi.
#
# SAATLER YEREL (TR). Piyasa saatleri dis gercektir ama sabit degildir:
# BIST seans saatleri gecmiste degisti. Bu yuzden kodda degil burada.
takvim:
  seanslar:
    kripto:
      gunler: her_gun          # 7/24 acik
      baslangic: "00:00"
      bitis: "23:59"
    bist:
      gunler: hafta_ici
      baslangic: "10:00"
      bitis: "18:00"
    abd:
      gunler: hafta_ici
      baslangic: "16:30"
      bitis: "23:00"

  # Gun sonu ozeti bu saatten sonraki ilk kosuda gider (gunde bir kez).
  #
  # 23:30 DEGISTIRILEMEZ gibi davran: cron ('30 20' UTC) tam bu esige
  # ayarli. Saati kaydirip cron'u birakmak gun sonu kosusunu TARAMA'ya
  # dusurur ve ozet hic gitmez. Ikisi birlikte degisir.
  #
  # Gece 00:00 yazilamaz: gorev() "saat >= esik" diye bakar, 00:00 her
  # saatten kucuk oldugu icin GUNUN HER KOSUSU gun sonu olur - brifing ve
  # tarama hic calismaz. Ayrica 00:00 zaten ertesi TR gunudur.
  gun_sonu_saati: "23:30"

  # Gunluk brifing: ogle saatinde "bugune kadar ne oldu" ozeti.
  # her_gun = brifing haftanin her gunu calisir.
  #
  # 13:00 secildi cunku mevcut 2 saatlik tarama gridi ('7 */2' UTC) zaten
  # TR 13:07'de kosuyor - brifing icin AYRI CRON GEREKMIYOR, ek Actions
  # dakikasi yakilmiyor. Brifing penceresi 60 dakika oldugu icin cron'un
  # 5-30 dakikalik gecikmesi brifingi dusurmez.
  brifing_gunu: her_gun
  brifing_saati: "13:00"

  # Haftalik ozet gunu (0=Pazartesi ... 4=Cuma). Gun sonu saatinde calisir
  # ve o gunun gun sonu ozetinin YERINE gecer - haftalik zaten gunun
  # kapanisini da icerir, ikisini ayri gondermek ayni sayilari iki kez
  # yollamak olurdu.
  #
  # Cuma: BIST ve Nasdaq haftasinin kapandigi gun. Kripto 7/24 acik ama
  # haftayi kapatan sey diger iki piyasanin kapanisi.
  haftalik_gunu: 4

# Telegram SORGU botu (scripts/yatirim/bot_sorgu.py) - salt okunur.
#
# Workflow cron'u sabit 30 dakikadir; GitHub Actions zamanlamasi YAML
# okuyamaz. Aralik burada tanimlanir, script fazladan kosuyu erken keser -
# yani sikligi degistirmek icin workflow'a dokunmak gerekmez.
#
# DAKIKA BUTCESI: 30 dakikalik aralik x 18 saat = 36 kosu/gun = ~1095 dk/ay.
# Rapor workflow'unun ~400 dk'si ustune ~1500 dk (2000'in %75'i). Butceyi
# yariya indirmek icin aralik_dakika: 60 yaz - workflow degismez.
bot:
  aralik_dakika: 30
  baslangic_saat_tr: 7     # bu saatten once cevap verilmez
  bitis_saat_tr: 1         # ertesi gun; gece bosuna dakika yakilmasin
